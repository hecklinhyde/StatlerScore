  # -- Multi-region hardener Lambda ------------------------------------------
  # On stack creation:
  #   Per region: EBS encryption, GuardDuty, Security Hub, Access Analyzer,
  #               VPC flow logs on every VPC that lacks them
  #   Global:     IAM password policy, S3 versioning + TLS on every bucket

  HardenerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HardenerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:EnableEbsEncryptionByDefault
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:DescribeRegions
                  - ec2:DescribeVpcs
                  - ec2:DescribeFlowLogs
                  - ec2:CreateFlowLogs
                  - guardduty:CreateDetector
                  - guardduty:ListDetectors
                  - securityhub:EnableSecurityHub
                  - securityhub:DescribeHub
                  - access-analyzer:CreateAnalyzer
                  - access-analyzer:ListAnalyzers
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogDelivery
                  - s3:ListAllMyBuckets
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - iam:UpdateAccountPasswordPolicy
                  - iam:CreateServiceLinkedRole
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt FlowLogRole.Arn

  HardenerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt HardenerRole.Arn
      Timeout: 600
      Environment:
        Variables:
          FLOW_LOG_ROLE_ARN: !GetAtt FlowLogRole.Arn
      Code:
        ZipFile: |
          import boto3, json, os, urllib.request

          def send(event, context, status, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason[:255],
                  'PhysicalResourceId': 'PerfectScoreHardener',
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
              }).encode()
              req = urllib.request.Request(
                  event['ResponseURL'], data=body, method='PUT',
                  headers={'Content-Type': ''})
              urllib.request.urlopen(req)

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send(event, context, 'SUCCESS')
                  return

              flow_log_role = os.environ['FLOW_LOG_ROLE_ARN']
              errors = []

              try:
                  regions = [r['RegionName'] for r in
                      boto3.client('ec2', region_name='us-east-1').describe_regions(
                          Filters=[{'Name': 'opt-in-status',
                                    'Values': ['opt-in-not-required', 'opted-in']}]
                      )['Regions']]

                  for region in regions:
                      ec2 = boto3.client('ec2', region_name=region)
                      logs = boto3.client('logs', region_name=region)

                      # EBS encryption by default
                      try:
                          ec2.enable_ebs_encryption_by_default()
                      except Exception as e:
                          errors.append(f'EBS {region}: {e}')

                      # GuardDuty
                      try:
                          gd = boto3.client('guardduty', region_name=region)
                          if not gd.list_detectors()['DetectorIds']:
                              gd.create_detector(Enable=True)
                      except Exception as e:
                          errors.append(f'GD {region}: {e}')

                      # Security Hub
                      try:
                          sh = boto3.client('securityhub', region_name=region)
                          sh.enable_security_hub(EnableDefaultStandards=False)
                      except Exception as e:
                          if 'already' not in str(e).lower() and 'ResourceConflict' not in str(e):
                              errors.append(f'SH {region}: {e}')

                      # IAM Access Analyzer
                      try:
                          aa = boto3.client('accessanalyzer', region_name=region)
                          if not aa.list_analyzers(type='ACCOUNT')['analyzers']:
                              aa.create_analyzer(analyzerName='hardener-analyzer', type='ACCOUNT')
                      except Exception as e:
                          errors.append(f'AA {region}: {e}')

                      # VPC flow logs -- enable on every VPC that lacks them
                      try:
                          vpcs = [v['VpcId'] for v in ec2.describe_vpcs()['Vpcs']]
                          covered = {fl['ResourceId'] for fl in
                                     ec2.describe_flow_logs()['FlowLogs']}
                          uncovered = [v for v in vpcs if v not in covered]
                          if uncovered:
                              lg = f'/aws/vpc/hardener-{region}'
                              try:
                                  logs.create_log_group(logGroupName=lg)
                              except Exception:
                                  pass  # already exists
                              ec2.create_flow_logs(
                                  ResourceIds=uncovered,
                                  ResourceType='VPC',
                                  TrafficType='ALL',
                                  LogDestinationType='cloud-watch-logs',
                                  LogGroupName=lg,
                                  DeliverLogsPermissionArn=flow_log_role,
                              )
                      except Exception as e:
                          errors.append(f'FlowLogs {region}: {e}')

                  # IAM password policy (global)
                  try:
                      boto3.client('iam').update_account_password_policy(
                          MinimumPasswordLength=14,
                          RequireUppercaseCharacters=True,
                          RequireLowercaseCharacters=True,
                          RequireNumbers=True,
                          RequireSymbols=True,
                          MaxPasswordAge=90,
                          PasswordReusePrevention=24,
                          AllowUsersToChangePassword=True,
                      )
                  except Exception as e:
                      errors.append(f'IAM passwd: {e}')

                  # S3 -- versioning + TLS on every bucket (global)
                  try:
                      s3 = boto3.client('s3')
                      buckets = [b['Name'] for b in s3.list_buckets()['Buckets']]
                      for bucket in buckets:
                          try:
                              loc = s3.get_bucket_location(Bucket=bucket)['LocationConstraint']
                              s3r = boto3.client('s3', region_name=loc or 'us-east-1')
                          except Exception:
                              s3r = s3

                          # Enable versioning
                          try:
                              s3r.put_bucket_versioning(
                                  Bucket=bucket,
                                  VersioningConfiguration={'Status': 'Enabled'},
                              )
                          except Exception as e:
                              errors.append(f'S3 ver {bucket}: {e}')

                          # Enforce TLS — add DenyNonTLS statement if absent
                          try:
                              try:
                                  policy = json.loads(
                                      s3r.get_bucket_policy(Bucket=bucket)['Policy'])
                              except Exception as ex:
                                  if 'NoSuchBucketPolicy' in str(ex):
                                      policy = {'Version': '2012-10-17', 'Statement': []}
                                  else:
                                      raise
                              sids = {st.get('Sid', '') for st in policy['Statement']}
                              if 'DenyNonTLS' not in sids:
                                  policy['Statement'].append({
                                      'Sid': 'DenyNonTLS',
                                      'Effect': 'Deny',
                                      'Principal': '*',
                                      'Action': 's3:*',
                                      'Resource': [
                                          f'arn:aws:s3:::{bucket}',
                                          f'arn:aws:s3:::{bucket}/*',
                                      ],
                                      'Condition': {
                                          'Bool': {'aws:SecureTransport': 'false'}
                                      },
                                  })
                                  s3r.put_bucket_policy(
                                      Bucket=bucket, Policy=json.dumps(policy))
                          except Exception as e:
                              errors.append(f'S3 TLS {bucket}: {e}')
                  except Exception as e:
                      errors.append(f'S3 global: {e}')

              except Exception as e:
                  send(event, context, 'FAILED', str(e))
                  return

              msg = ('All regions hardened.' if not errors
                     else f'Done with {len(errors)} error(s): {errors[:3]}')
              send(event, context, 'SUCCESS', msg)

  HardenerResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt HardenerFunction.Arn

  #CloudWatch alarms
  AlarmCPU1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-cpu-high-1'
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Instance1}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

  AlarmCPU2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-cpu-high-2'
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Instance2}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

  AlarmStatus1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-status-1'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Instance1}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

  AlarmStatus2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-status-2'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Instance2}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

  AlarmRDSCPU:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-rds-cpu'
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref RDSInstance}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

  AlarmRDSStorage:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-rds-storage'
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref RDSInstance}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5368709120
      ComparisonOperator: LessThanThreshold

  AlarmRDSConnections:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-rds-connections'
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref RDSInstance}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold

  AlarmCFErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-cf-5xx'
