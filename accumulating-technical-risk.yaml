# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/format-version-structure.html
# 2010-09-09 is the only valid value
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Accumulating Technical Risk Demo. Intentionally misconfigured AWS resources
  designed to demonstrate what a "Accumlating Technical Risk" Statler Score looks like.
  584 = Accumulating Technical Risk
  WARNING: Never use in production.

Parameters:
  LatestAL2AMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: Latest Amazon Linux 2 AMI — resolved automatically per region

Resources:

  #VPC with no flow logs
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true 
      Tags:
        - Key: Name
          Value: accumlating-technical-risk-vpc

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  IGW:
    Type: AWS::EC2::InternetGateway

  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  RTAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  RTAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # Security groups

  SGOpenSSH:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH open to world
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0}

  SGOpenRDP:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDP open to world
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3389, ToPort: 3389, CidrIp: 0.0.0.0/0}

  SGInternal:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal-only used by RDS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref SGOpenSSH

  # EC2 
  Instance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAL2AMI
      SubnetId: !Ref SubnetA
      SecurityGroupIds: [!Ref SGOpenSSH]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: atr-instance-1

  Instance2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAL2AMI
      SubnetId: !Ref SubnetB
      SecurityGroupIds: [!Ref SGOpenRDP]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: atr-instance-instance-az2

  #RDS private with backups

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Accumlating-Technical-Risk-demo DB subnet group
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: '8.0'
      MasterUsername: admin
      MasterUserPassword: ATRDemo2026!
      AllocatedStorage: '20'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref SGInternal]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      MultiAZ: false
      StorageEncrypted: true
      DeletionProtection: false

  #S3 app bucket

  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'atr-credit-app-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AppBucket.Arn
              - !Sub '${AppBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # CloudTrail single-region

  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'atr-credit-trail-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: atr-credit-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: false
      EnableLogFileValidation: false

  #IAM Access Analyzer
# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-accessanalyzer-analyzer.html
  AccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Properties:
      AnalyzerName: atr-credit-analyzer
      Type: ACCOUNT

  #AWS Backup
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: atr-credit-vault

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: atr-credit-plan
        BackupPlanRule:
          - RuleName: DailyBackup
            TargetBackupVaultName: !Ref BackupVault
            ScheduleExpression: 'cron(0 3 * * ? *)'
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: 30

  #CloudWatch alarms

  AlarmCPU1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atr-cpu-instance1
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Instance1}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

  AlarmCPU2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atr-cpu-instance2
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Instance2}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

  AlarmStatus1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atr-status-instance1
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Instance1}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

  AlarmStatus2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atr-status-instance2
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Instance2}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

  AlarmRDS:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: atr-rds-connections
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref RDSInstance}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold

Outputs:
  VPCId:
    Value: !Ref VPC

  Instance1Id:
    Value: !Ref Instance1

  Instance2Id:
    Value: !Ref Instance2

  RDSEndpoint:
    Value: !GetAtt RDSInstance.Endpoint.Address

  AppBucket:
    Value: !Ref AppBucket

  AnalyzerId:
    Value: !Ref AccessAnalyzer

  BackupPlanId:
    Value: !Ref BackupPlan

  ExpectedScore:
    Description: Expected Cloud Credit Score range
    Value: "580-670"
